# dsh bundle patch：把本插件插入 profile 层栈。
#
# 说明：
# - 人侧通道（授权状态、登录、登出、工具清单、CIMD 模板）由本插件在宿主
#   web server 上注册 `/dsh-undermind/api/*` 路由。
# - 模型侧工具由本插件**自持**：直连 Undermind 的 MCP 端点
#   （https://mcp.undermind.ai/mcp），带 OAuth Bearer 并自动续期，按
#   `disabledTools` 过滤后以 `mcp__undermind__*` 注册。
# - 因此这里**不再**插入 `@deepseek-ai/dsh-mcp-client`：它只透传静态 headers，
#   没有令牌刷新能力；且同名 server 会与本插件自注册的工具重名冲突。
- insert:
    - id: dsh-plugin-undermind
      name: dsh-plugin-undermind
